<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Batilandia</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#7C0C17">

<!-- Para guardar el panel como app. Manifiesto propio: si usara el del
     sitio, al instalarlo abriría el menú de clientes en vez del panel. -->
<link rel="manifest" href="manifest-panel.json">
<link rel="apple-touch-icon" href="icono-panel-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%99%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Fredoka:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --rosa-suave:#FDE4E1; --crema:#FFF9F6; --vino:#A4121F; --vino-osc:#7C0C17;
  --oro:#E4B04A; --tinta:#5A2A2E; --tinta-suave:#8E5A5E; --linea:#F0D6D4;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--crema);color:var(--tinta);
  font-family:"Fredoka",system-ui,-apple-system,sans-serif;font-weight:400;line-height:1.5;
  padding-bottom:110px;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}

.tope{
  position:sticky;top:0;z-index:20;background:var(--vino);color:#fff;
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.tope h1{font-family:"Yellowtail",cursive;font-size:1.6rem;margin:0;font-weight:400}
.tope .salir{font-size:.85rem;background:rgba(255,255,255,.16);padding:7px 14px;border-radius:999px}

.envoltura{max-width:680px;margin:0 auto;padding:18px}
.caja{background:#fff;border:2px solid var(--linea);border-radius:18px;padding:20px;margin-bottom:16px}
.caja h2{margin:0 0 6px;font-size:1.15rem;font-weight:500;color:var(--vino)}
.caja p.ayuda{margin:0 0 16px;font-size:.9rem;font-weight:300;color:var(--tinta-suave)}
.caja p.ayuda a{color:var(--vino)}

label.campo{display:block;margin-bottom:13px}
label.campo span{display:block;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-suave);margin-bottom:5px;font-weight:500}
input[type=text],input[type=number],input[type=password],input[type=time],textarea,select{
  width:100%;padding:11px 13px;border-radius:12px;border:2px solid var(--linea);
  background:#fff;font-family:inherit;font-size:1rem;color:var(--tinta);resize:vertical;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--oro)}
.marca-check{display:flex;align-items:center;gap:9px;margin-bottom:12px;font-size:.96rem}
.marca-check input{width:20px;height:20px;accent-color:var(--vino)}

.boton{background:var(--vino);color:#fff;padding:13px 22px;border-radius:12px;font-weight:500;width:100%;text-align:center}
.boton.fantasma{background:#fff;color:var(--vino);box-shadow:inset 0 0 0 2px var(--vino)}
.boton.peligro{background:#fff;color:#B0303C;box-shadow:inset 0 0 0 2px #E3B9BB}
.boton[disabled]{opacity:.5;cursor:not-allowed}

.pestanas{display:flex;gap:5px;background:var(--rosa-suave);padding:5px;border-radius:14px;margin-bottom:18px}
.pestanas button{flex:1;padding:10px 3px;border-radius:10px;font-size:.82rem;font-weight:500;color:var(--vino);white-space:nowrap}
.pestanas button[aria-selected="true"]{background:var(--vino);color:#fff}
.pestanas .pendientes{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--vino);color:#fff;font-size:.72rem;line-height:18px;vertical-align:1px}
.pestanas button[aria-selected="true"] .pendientes{background:#fff;color:var(--vino)}

/* ---------- pedidos ---------- */
.resumen-dia{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.dato{background:#fff;border:2px solid var(--linea);border-radius:14px;padding:12px 14px}
.dato b{display:block;font-size:1.45rem;font-weight:600;color:var(--vino);line-height:1.2}
.dato small{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-suave);font-weight:500}

.filtros{display:flex;gap:6px;margin-bottom:14px}
.filtros button{flex:1;padding:9px 4px;border-radius:10px;background:var(--rosa-suave);color:var(--vino);font-size:.85rem;font-weight:500}
.filtros button[aria-pressed="true"]{background:var(--vino);color:#fff}

.pedido-caja{background:#fff;border:2px solid var(--linea);border-radius:16px;padding:14px;margin-bottom:10px}
.pedido-caja.entregado,.pedido-caja.cancelado{opacity:.55}
.pedido-tope{display:flex;align-items:baseline;gap:8px}
.pedido-tope b{flex:1;font-weight:500;font-size:1.02rem}
/* el código que el cliente tiene en su mensaje de WhatsApp */
.codigo{
  font-size:.76rem;font-weight:600;letter-spacing:.06em;
  background:var(--vino);color:#fff;padding:2px 8px;border-radius:7px;
  flex:0 0 auto;font-variant-numeric:tabular-nums;
}
.pago{font-weight:400;padding:1px 7px;border-radius:6px}
.pago.efectivo{background:#DFF2E4;color:#1E6B38}
.pago.transfer{background:#E4E8F5;color:#33447A}
.ver-mapa{color:var(--vino);font-weight:500;text-decoration:none;
  border-bottom:1px solid rgba(164,18,31,.35)}
.buscar-pedido{margin-bottom:13px}
.buscar-pedido input{text-transform:uppercase}
.buscar-pedido input::placeholder{text-transform:none}
.pedido-tope .plata{font-weight:600;color:var(--vino);font-size:1.1rem;white-space:nowrap}
.pedido-hora{font-size:.8rem;font-weight:300;color:var(--tinta-suave);margin:2px 0 9px}
.etiqueta-estado{display:inline-block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
  font-weight:500;padding:2px 8px;border-radius:999px;background:var(--rosa-suave);color:var(--tinta-suave)}
.pedido-items{list-style:none;margin:0 0 9px;padding:0;font-size:.92rem;font-weight:300}
.pedido-items li{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
.pedido-extra{font-size:.86rem;font-weight:300;color:var(--tinta-suave);margin:0 0 10px}
.pedido-extra span{display:block}
.pedido-acciones{display:flex;gap:8px}
.pedido-acciones button{flex:1;padding:10px 6px;border-radius:10px;font-size:.86rem;font-weight:500}
.pedido-acciones button[disabled]{opacity:.5}
.b-entregado{background:#DFF2E4;color:#1E6B38}
.b-cancelar{background:var(--rosa-suave);color:#B0303C}
.b-volver{background:var(--rosa-suave);color:var(--vino)}

.top-lista{list-style:none;margin:0;padding:0;counter-reset:t}
.top-lista li{counter-increment:t;display:flex;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--linea);font-size:.95rem}
.top-lista li:last-child{border-bottom:0}
.top-lista li::before{content:counter(t);flex:0 0 24px;width:24px;height:24px;border-radius:50%;
  background:var(--oro);color:var(--vino-osc);display:grid;place-items:center;font-size:.78rem;font-weight:600}
.top-lista .cuantos{margin-left:auto;font-weight:500;color:var(--vino);white-space:nowrap}

.encabezado-lista{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.encabezado-lista h2{flex:1;margin:0;font-family:"Yellowtail",cursive;font-size:1.7rem;font-weight:400;color:var(--vino)}
.encabezado-lista .boton{width:auto;padding:10px 16px;font-size:.9rem}

.grupo-cat{margin-bottom:22px}
.grupo-cat h3{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-suave);margin:0 0 8px;font-weight:500}
.tarjeta-item{
  display:flex;align-items:center;gap:11px;background:#fff;border:2px solid var(--linea);
  border-radius:14px;padding:9px 11px;margin-bottom:8px;
}
.tarjeta-item.agotado{opacity:.6}
.miniatura{flex:0 0 46px;width:46px;height:46px;border-radius:11px;overflow:hidden;background:var(--rosa-suave);display:grid;place-items:center;font-size:1.3rem}
.miniatura img{width:100%;height:100%;object-fit:cover}
.centro{flex:1;min-width:0}
.centro b{display:block;font-weight:500;font-size:1rem}
.centro small{display:block;font-size:.82rem;font-weight:300;color:var(--tinta-suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marcas{display:flex;gap:5px;flex-shrink:0}
.marca-btn{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-size:.95rem;background:var(--rosa-suave);
}
.marca-btn[aria-pressed="true"]{background:var(--oro)}
.marca-btn.stock[aria-pressed="true"]{background:#E0D3D3}

.fila-dia{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.fila-dia .nombre-dia{font-size:.95rem;text-transform:capitalize}
.fila-dia input[type=time]{padding:8px 10px;font-size:.9rem}
.fila-dia.cerrado .nombre-dia{opacity:.45}

.barra-guardar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:#fff;border-top:2px solid var(--linea);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;
}
.barra-guardar span{flex:1;font-size:.88rem;font-weight:300;color:var(--tinta-suave)}
.barra-guardar .boton{width:auto;padding:12px 22px}

.velo{position:fixed;inset:0;background:rgba(60,10,16,.55);z-index:40;display:none}
.velo.abierto{display:block}
.modal{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--crema);
  border-radius:20px 20px 0 0;padding:8px 18px 22px;max-height:92vh;overflow-y:auto;
  max-width:620px;margin:0 auto;transform:translateY(100%);transition:transform .28s ease;
}
.modal.abierto{transform:translateY(0)}
.agarre{width:44px;height:5px;border-radius:3px;background:#E3B9BB;margin:0 auto 14px}
.modal h2{font-family:"Yellowtail",cursive;color:var(--vino);font-size:1.7rem;margin:0 0 16px;font-weight:400;text-align:center}
.acciones-modal{display:grid;gap:9px;margin-top:6px}

.previo{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.previo .cuadro{width:70px;height:70px;border-radius:14px;overflow:hidden;background:var(--rosa-suave);display:grid;place-items:center;font-size:1.6rem;flex:0 0 70px}
.previo .cuadro img{width:100%;height:100%;object-fit:cover}
.previo .lado{flex:1;display:grid;gap:6px}
.previo .lado button{font-size:.86rem;padding:9px 12px;border-radius:10px;background:var(--rosa-suave);color:var(--vino);font-weight:500}
input[type=file]{display:none}

.mensaje{padding:11px 14px;border-radius:12px;font-size:.9rem;font-weight:300;margin-bottom:14px}
.mensaje.error{background:#FBE0E2;color:#8E1D28}
.mensaje.ok{background:#DFF2E4;color:#1E6B38}
.mensaje.trabajando{background:#FBEEDA;color:#8A5A22}
.vacio-lista{text-align:center;color:var(--tinta-suave);font-weight:300;padding:26px}

/* guardar el panel como app */
.boton.instalar{display:flex;align-items:center;justify-content:center;gap:9px}
.boton.instalar svg{width:19px;height:19px;flex:0 0 auto}
.pasos-iphone{
  margin-top:12px;background:var(--rosa-suave);border-radius:12px;
  padding:12px 14px;font-size:.88rem;font-weight:300;line-height:1.55;
}
.pasos-iphone b{font-weight:500;color:var(--vino)}
.pasos-iphone .compartir{display:inline-grid;place-items:center;width:19px;height:19px;
  vertical-align:-5px;color:#0A84FF}
.ya-guardada{
  display:flex;align-items:center;gap:9px;margin:0;
  font-size:.9rem;font-weight:300;color:#1E6B38;
}
.ya-guardada svg{width:20px;height:20px;flex:0 0 auto}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px;border-radius:8px}
</style>
</head>

<body>

<header class="tope">
  <h1>Panel de Batilandia</h1>
  <button class="salir" id="salir" hidden>Salir</button>
</header>

<div class="envoltura">

  <!-- ============ ENTRAR ============ -->
  <section id="entrar" class="caja">
    <h2>Entrar al panel</h2>
    <p class="ayuda">Escribí tu clave. Queda guardada en este teléfono, así la próxima vez entra sola.</p>
    <div id="msg-entrar"></div>
    <label class="campo">
      <span>Clave</span>
      <input type="password" id="in-clave" placeholder="La que creaste en Cloudflare"
             autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="current-password">
    </label>
    <button class="boton" id="btn-entrar">Entrar</button>
  </section>

  <!-- ============ PANEL ============ -->
  <main id="panel" hidden>
    <div class="pestanas" role="tablist">
      <button role="tab" data-t="pedidos" aria-selected="true">Pedidos<span class="pendientes" id="contador-pendientes" hidden></span></button>
      <button role="tab" data-t="batidos" aria-selected="false">Batidos</button>
      <button role="tab" data-t="categorias" aria-selected="false">Categorías</button>
      <button role="tab" data-t="negocio" aria-selected="false">Negocio</button>
    </div>
    <div id="vista"></div>
  </main>
</div>

<div class="barra-guardar" id="barra" hidden>
  <span id="aviso-guardar">Sin cambios pendientes</span>
  <button class="boton" id="btn-guardar" disabled>Publicar</button>
</div>

<div class="velo" id="velo"></div>
<section class="modal" id="modal" role="dialog" aria-modal="true"></section>

<script>
/* =========================================================
   PANEL DE BATILANDIA
   Guarda el contenido en datos.json dentro de tu repositorio
   de GitHub. Cloudflare republica el sitio solo.
   ========================================================= */

/* --- guardado local tolerante (si el navegador lo bloquea, usa memoria) --- */
const memoria = {};
const recordar = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){ memoria[k]=v; } };
const recordado = k => { try{ return localStorage.getItem(k); }catch(e){ return memoria[k]||null; } };
const olvidar = k => { try{ localStorage.removeItem(k); }catch(e){ delete memoria[k]; } };

let CLAVE = "";            // la única contraseña del panel
let D = null;              // contenido completo
let sucio = false;         // hay cambios sin publicar
let vistaActual = "pedidos";
let filtroTexto = "";
let filtroPedidos = "nuevo";
let buscarPedido = "";       // código del chat, o nombre
let esperaBusqueda = null;

const $ = s => document.querySelector(s);
const escapar = t => String(t==null?"":t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const idNuevo = pre => pre + Date.now().toString(36) + Math.floor(Math.random()*90+10);
const babel = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const resbalar = s => babel(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "foto";

/* =========================================================
   Guardar el panel como app
   Android avisa solo y se instala de un toque. iPhone no deja
   automatizarlo: ahí se muestran los pasos a mano.
   ========================================================= */
let pedidoInstalar = null;
const esIPhone = /iphone|ipad|ipod/i.test(navigator.userAgent);
const yaEsApp = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const sePuedeInstalar = () => !yaEsApp && (pedidoInstalar !== null || esIPhone);

/* si el aviso llega mientras mirás Negocio, el botón aparece solo */
const refrescarSiEstaEnNegocio = () => { if (vistaActual === "negocio") pintarNegocio(); };

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  pedidoInstalar = e;
  refrescarSiEstaEnNegocio();
});
window.addEventListener("appinstalled", () => {
  pedidoInstalar = null;
  refrescarSiEstaEnNegocio();
});

async function instalarApp(){
  if (pedidoInstalar){
    pedidoInstalar.prompt();
    const r = await pedidoInstalar.userChoice;
    pedidoInstalar = null;
    if (r.outcome === "accepted") refrescarSiEstaEnNegocio();
    return;
  }
  const pasos = $("#pasos-iphone");
  if (pasos) pasos.hidden = !pasos.hidden;
}

/* El trabajador de servicio es lo que hace que el teléfono lo
   considere una app. Es el mismo del sitio. */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* =========================================================
   El vaso dibujado
   El mismo que usa el sitio cuando un batido no tiene foto,
   para que acá los veas igual que tus clientes.
   ========================================================= */
const TONOS = [
  ["oreo","#3E3238"],["galleta","#8A6236"],["caramelo","#C97B33"],["capuccino","#8A5A32"],
  ["moka","#6E4326"],["pinguino","#4A3F45"],["chocolate","#6B3A24"],["fresa","#E8546B"],
  ["banano","#F3C63E"],["ciruela","#7B3F6B"],["arandanos","#5C4A8C"],["vainilla","#F0E0B8"],
  ["sandia","#E85F55"],["papaya","#F0913C"],["manzana","#9CC63E"],["melon","#F5A65B"],
  ["coco","#F6EFE2"],["mani","#C89A5B"],["nancite","#E8C24A"],["pina","#F2D34B"],
  ["mixta","#C98B6B"],["mixto","#C98B6B"],["leche","#F7F0E4"],["pasa","#6E4A6E"],
  ["ron","#8A5A3C"],["sencillo","#CBAB8C"],["verde","#7FB83E"],["tropical","#F4A03C"],
  ["fruti","#E8546B"],["verano","#F26D5B"]
];
let contadorVaso = 0;
function vasoSVG(nombre, cat){
  const n = babel(nombre||""), hallados = [];
  for (const [k,c] of TONOS){
    if (n.includes(k) && !hallados.includes(c)) hallados.push(c);
    if (hallados.length === 2) break;
  }
  if (!hallados.length) hallados.push("#EF7D8C");
  if (hallados.length === 1) hallados.push(hallados[0]);
  const [a,b] = hallados, id = "va" + (contadorVaso++);
  const cuerpo = "M10 18 H34 L30.5 51 A3 3 0 0 1 27.5 54 H16.5 A3 3 0 0 1 13.5 51 Z";
  const copete = cat === "smoothies"
    ? '<circle cx="22" cy="12" r="5" fill="#8FBF4A"/><path d="M22 12 q6 -5 9 -2 q-3 5 -9 2Z" fill="#B5D96B"/>'
    : '<path d="M11.5 18 q2.5 -8 6 -8 q1.5 -4 5 -2 q4 -1 4.6 3.4 q2.4 2.6 1.4 6.6 Z" fill="#FFF6EC"/>';
  return '<svg viewBox="0 0 44 56" aria-hidden="true" style="width:100%;height:100%;padding:3px">' +
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="'+b+'"/><stop offset="60%" stop-color="'+a+'"/></linearGradient></defs>' +
    '<path d="'+cuerpo+'" fill="url(#'+id+')"/>' + copete +
    '<path d="'+cuerpo+'" fill="none" stroke="#7C0C17" stroke-opacity=".28" stroke-width="1.8" stroke-linejoin="round"/>' +
    '<rect x="23" y="1" width="4" height="17" rx="2" fill="#E4B04A" transform="rotate(15 25 9)"/></svg>';
}

function mensaje(donde, texto, tipo){
  const c = $(donde);
  if (!c) return;
  c.innerHTML = texto ? '<div class="mensaje '+tipo+'">'+escapar(texto)+'</div>' : "";
}

/* =========================================================
   El servidor
   Todo pasa por acá: el menú, las fotos y los pedidos. La llave
   de GitHub vive como secreto en Cloudflare, nunca en el teléfono.
   ========================================================= */
async function api(ruta, opciones){
  const r = await fetch("/api" + ruta, Object.assign({}, opciones, {
    headers: Object.assign({
      "Authorization": "Bearer " + CLAVE,
      "content-type": "application/json"
    }, (opciones && opciones.headers) || {})
  }));
  if (r.status === 401) throw new Error("Esa clave no es correcta.");
  if (r.status === 404) throw new Error("No encontré el servidor. Si estás viendo el sitio en local, el panel solo funciona en el sitio publicado.");
  if (!r.ok){
    let detalle = "";
    try { detalle = (await r.json()).error || ""; } catch(e){}
    throw new Error(detalle || ("El servidor respondió " + r.status + "."));
  }
  return r.json();
}

/* Qué falta configurar en Cloudflare. Se consulta sin clave, para
   poder avisar antes de que escribas nada. */
async function estadoServidor(){
  try {
    const r = await fetch("/api/estado");
    if (!r.ok) return null;
    return await r.json();
  } catch(e){ return null; }
}

async function leerDatos(){
  return (await api("/contenido")).datos;
}

async function guardarDatos(datos){
  return api("/contenido", { method:"PUT", body: JSON.stringify({ datos: datos }) });
}

/* --- fotos: se achican antes de subir --- */
function comprimir(archivo, lado, calidad){
  return new Promise((ok, err) => {
    const lector = new FileReader();
    lector.onerror = () => err(new Error("No se pudo leer la foto."));
    lector.onload = () => {
      const img = new Image();
      img.onerror = () => err(new Error("El archivo no parece una foto."));
      img.onload = () => {
        let w = img.width, h = img.height;
        const mayor = Math.max(w, h);
        if (mayor > lado){ const f = lado / mayor; w = Math.round(w*f); h = Math.round(h*f); }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        ok(c.toDataURL("image/jpeg", calidad).split(",")[1]);
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}

async function subirFoto(archivo, nombreBase){
  const b64 = await comprimir(archivo, 900, 0.82);
  const r = await api("/foto", { method:"POST",
    body: JSON.stringify({ nombre: nombreBase, base64: b64 }) });
  return r.ruta;
}

const TITULO_PEDIDOS = '<div class="encabezado-lista"><h2>Pedidos</h2>' +
  '<button class="boton fantasma" data-recargar>Actualizar</button></div>';

/* Hora si es de hoy, día y hora si es más viejo */
function cuando(ms){
  const d = new Date(ms);
  const hora = d.toLocaleTimeString("es-NI", { hour:"numeric", minute:"2-digit" });
  if (d.toDateString() === new Date().toDateString()) return hora;
  return d.toLocaleDateString("es-NI", { day:"numeric", month:"short" }) + " · " + hora;
}

function contadorPendientes(cuantos){
  const c = $("#contador-pendientes");
  c.textContent = cuantos || "";
  c.hidden = !cuantos;
}

function tarjetaPedido(p){
  const items = p.items.map(i =>
    '<li><span>'+i.cantidad+'× '+escapar(i.nombre)+'</span><span>C$'+(i.precio*i.cantidad)+'</span></li>'
  ).join("");
  /* El mismo código que el cliente tiene en su mensaje de WhatsApp */
  const codigo = p.codigo ? '<span class="codigo">#'+escapar(p.codigo)+'</span>' : '';

  /* El enlace del mapa se arma acá con los números guardados, no con
     una dirección que haya mandado el navegador de nadie. */
  const mapa = (p.lat != null && p.lon != null)
    ? '<a class="ver-mapa" target="_blank" rel="noopener" ' +
      'href="https://www.google.com/maps?q='+p.lat+','+p.lon+'">Ver en el mapa</a>'
    : '';

  const extra = (p.direccion || p.nota || mapa)
    ? '<p class="pedido-extra">' +
      (p.direccion ? '<span>Entrega: '+escapar(p.direccion)+'</span>' : '') +
      (mapa        ? '<span>'+mapa+'</span>' : '') +
      (p.nota      ? '<span>Nota: '+escapar(p.nota)+'</span>' : '') + '</p>'
    : '';

  const acciones = p.estado === "nuevo"
    ? '<button class="b-entregado" data-estado="entregado" data-pedido="'+p.id+'">Entregado</button>' +
      '<button class="b-cancelar" data-estado="cancelado" data-pedido="'+p.id+'">No se concretó</button>'
    : '<button class="b-volver" data-estado="nuevo" data-pedido="'+p.id+'">Volver a sin confirmar</button>';

  return '<div class="pedido-caja '+escapar(p.estado)+'">' +
    '<div class="pedido-tope">'+codigo+'<b>'+escapar(p.cliente || "Sin nombre")+'</b>' +
      '<span class="plata">C$'+p.total+'</span></div>' +
    '<p class="pedido-hora">'+cuando(p.creado)+' · '+p.unidades+(p.unidades === 1 ? ' batido' : ' batidos') +
      ' · <span class="pago '+(p.pago === "transferencia" ? "transfer" : "efectivo")+'">' +
      (p.pago === "transferencia" ? "Transferencia" : "Efectivo") + '</span>' +
      (p.estado === "nuevo" ? '' : ' <span class="etiqueta-estado">'+escapar(p.estado)+'</span>') + '</p>' +
    '<ul class="pedido-items">'+items+'</ul>' + extra +
    '<div class="pedido-acciones">'+acciones+'</div></div>';
}

async function pintarPedidos(){
  $("#vista").innerHTML = TITULO_PEDIDOS + '<p class="vacio-lista">Buscando pedidos…</p>';

  let d;
  const consulta = buscarPedido
    ? "/pedidos?buscar=" + encodeURIComponent(buscarPedido)
    : "/pedidos?estado=" + filtroPedidos;
  try { d = await api(consulta); }
  catch(e){
    $("#vista").innerHTML = TITULO_PEDIDOS + '<div class="mensaje error">'+escapar(e.message)+'</div>';
    return;
  }
  if (vistaActual !== "pedidos") return;   // cambió de pestaña mientras cargaba

  const r = d.resumen;
  contadorPendientes(r.sinConfirmar);

  const etiquetas = { nuevo:"Sin confirmar", entregado:"Entregados", todos:"Todos" };
  let html = TITULO_PEDIDOS +
    '<div class="resumen-dia">' +
      '<div class="dato"><b>'+r.hoyCuantos+'</b><small>Entregados hoy</small></div>' +
      '<div class="dato"><b>C$'+r.hoyPlata+'</b><small>Vendido hoy</small></div>' +
    '</div>' +
    /* El código que el cliente tiene en su chat: cuatro letras y listo */
    '<label class="campo buscar-pedido"><input type="search" id="buscar-pedido" ' +
      'placeholder="Código del chat o nombre…" value="'+escapar(buscarPedido)+'" ' +
      'autocapitalize="characters" autocorrect="off" spellcheck="false"></label>';

  if (!buscarPedido){
    html += '<div class="filtros">' + Object.keys(etiquetas).map(k =>
      '<button data-filtro="'+k+'" aria-pressed="'+(k === filtroPedidos)+'">'+etiquetas[k]+
      (k === "nuevo" && r.sinConfirmar ? ' ('+r.sinConfirmar+')' : '')+'</button>'
    ).join("") + '</div>';
  }

  html += d.pedidos.length
    ? d.pedidos.map(tarjetaPedido).join("")
    : '<p class="vacio-lista">' + (buscarPedido
        ? "Ningún pedido con «" + escapar(buscarPedido) + "»."
        : (filtroPedidos === "nuevo"
          ? "Ningún pedido esperando confirmación."
          : "Todavía no hay pedidos acá.")) + '</p>';

  html += '<div class="encabezado-lista" style="margin-top:24px"><h2>Lo que más se vende</h2></div>';
  html += d.top.length
    ? '<div class="caja"><ul class="top-lista">' + d.top.map(t =>
        '<li>'+escapar(t.nombre)+'<span class="cuantos">'+t.vendidos+'</span></li>'
      ).join("") + '</ul>' +
      '<p class="ayuda" style="margin:12px 0 0">Últimos '+r.dias+' días, contando solo los pedidos que confirmaste ' +
      'como entregados, y desde '+r.minimo+' vendidos para arriba. Estos salen marcados como <b>populares</b> ' +
      'en el sitio, solos, sin que tengas que publicar nada.</p></div>'
    : '<div class="caja"><p class="ayuda" style="margin:0">Todavía no confirmaste ninguna entrega. ' +
      'Apenas confirmes las primeras, acá aparece el ranking y el sitio empieza a marcar solo los más pedidos.</p></div>';

  $("#vista").innerHTML = html;

  /* El buscador espera a que dejes de escribir, para no pedirle
     la lista al servidor en cada tecla. */
  const b = $("#buscar-pedido");
  if (b) b.addEventListener("input", e => {
    const valor = e.target.value;
    clearTimeout(esperaBusqueda);
    esperaBusqueda = setTimeout(async () => {
      buscarPedido = valor.trim();
      await pintarPedidos();
      const nuevo = $("#buscar-pedido");
      if (nuevo){ nuevo.focus(); nuevo.setSelectionRange(nuevo.value.length, nuevo.value.length); }
    }, 350);
  });
}

function pintarBatidos(){

    html += '<p class="vacio-lista">Primero creá una categoría.</p>';
  }

  D.categorias.forEach(cat => {
    const items = D.productos.filter(p => p.cat === cat.id && babel(p.nombre).includes(babel(filtroTexto)));
    if (!items.length) return;
    html += '<div class="grupo-cat"><h3>'+escapar(cat.nombre)+' · '+items.length+'</h3>';
    items.forEach(p => {
      const mini = p.foto
        ? '<img src="'+escapar(p.foto)+'" alt="" data-pid="'+p.id+'">'
        : vasoSVG(p.nombre, p.cat);
      html += '<div class="tarjeta-item'+(p.agotado?' agotado':'')+'">' +
        '<span class="miniatura">'+mini+'</span>' +
        '<button class="centro" style="text-align:left" data-editar="'+p.id+'">' +
          '<b>'+escapar(p.nombre)+'</b>' +
          '<small>C$'+p.precio+(p.descripcion?' · '+escapar(p.descripcion):'')+'</small>' +
        '</button>' +
        '<span class="marcas">' +
          '<button class="marca-btn" data-pop="'+p.id+'" aria-pressed="'+!!p.popular+'" title="Popular">★</button>' +
          '<button class="marca-btn stock" data-ago="'+p.id+'" aria-pressed="'+!!p.agotado+'" title="Agotado">✕</button>' +
        '</span></div>';
    });
    html += '</div>';
  });

  $("#vista").innerHTML = html;
  document.querySelectorAll(".miniatura img").forEach(img => {
    img.addEventListener("error", () => {
      const p = D.productos.find(x => x.id === img.dataset.pid);
      img.parentNode.innerHTML = p ? vasoSVG(p.nombre, p.cat) : vasoSVG("", "");
    });
  });
  const f = $("#filtro");
  if (f) f.addEventListener("input", e => { filtroTexto = e.target.value; pintarBatidos(); $("#filtro").focus(); });
}

function formularioProducto(p){

      D.categorias.map(c => '<option value="'+c.id+'"'+(c.id===p.cat?' selected':'')+'>'+escapar(c.nombre)+'</option>').join("") +
    '</select></label>' +
    '<label class="campo"><span>Nombre</span><input type="text" id="f-nombre" value="'+escapar(p.nombre)+'"></label>' +
    '<label class="campo"><span>Precio en córdobas</span><input type="number" id="f-precio" inputmode="numeric" value="'+p.precio+'"></label>' +
    '<label class="campo"><span>Descripción</span><textarea id="f-desc" rows="2" placeholder="Una línea corta: qué lleva o a qué sabe">'+escapar(p.descripcion)+'</textarea></label>' +
    '<label class="marca-check"><input type="checkbox" id="f-pop"'+(p.popular?" checked":"")+'> Mostrar como popular</label>' +
    '<label class="marca-check"><input type="checkbox" id="f-ago"'+(p.agotado?" checked":"")+'> Marcar como agotado</label>' +
    '<div class="acciones-modal">' +
      '<button class="boton" id="f-guardar">Guardar</button>' +
      (nuevo ? '' : '<button class="boton peligro" id="f-borrar">Eliminar este batido</button>') +
      '<button class="boton fantasma" data-cerrar>Cancelar</button>' +
    '</div>'
  );

  let fotoNueva = null, fotoActual = p.foto;

  $("#btn-foto").addEventListener("click", () => $("#archivo-foto").click());
  $("#btn-sinfoto").addEventListener("click", () => {
    fotoNueva = null; fotoActual = "";
    $("#previo-foto").innerHTML = vasoSVG($("#f-nombre").value || p.nombre, $("#f-cat").value);
  });
  $("#archivo-foto").addEventListener("change", e => {
    const a = e.target.files[0];
    if (!a) return;
    fotoNueva = a;
    const url = URL.createObjectURL(a);
    $("#previo-foto").innerHTML = '<img src="'+url+'" alt="">';
  });

  $("#f-guardar").addEventListener("click", async () => {
    const nombre = $("#f-nombre").value.trim();
    const precio = parseInt($("#f-precio").value, 10);
    if (!nombre){ mensaje("#msg-modal","Ponele un nombre al batido.","error"); return; }
    if (!(precio > 0)){ mensaje("#msg-modal","El precio tiene que ser un número mayor que cero.","error"); return; }

    $("#f-guardar").disabled = true;
    if (fotoNueva){
      mensaje("#msg-modal","Subiendo la foto…","trabajando");
      try { fotoActual = await subirFoto(fotoNueva, nombre); }
      catch(err){ mensaje("#msg-modal", err.message, "error"); $("#f-guardar").disabled = false; return; }
    }

    const datos = {
      id: p.id, cat: $("#f-cat").value, nombre: nombre, precio: precio,
      descripcion: $("#f-desc").value.trim(), foto: fotoActual,
      agotado: $("#f-ago").checked, popular: $("#f-pop").checked
    };
    const i = D.productos.findIndex(x => x.id === p.id);
    if (i >= 0) D.productos[i] = datos; else D.productos.push(datos);
    marcarSucio(); cerrarModal(); pintar();
  });

  const borrar = $("#f-borrar");
  if (borrar) borrar.addEventListener("click", () => {
    if (!confirm("¿Eliminar «" + p.nombre + "» del menú?")) return;
    D.productos = D.productos.filter(x => x.id !== p.id);
    marcarSucio(); cerrarModal(); pintar();
  });
}

        '<textarea id="n-banco" rows="3" placeholder="BAC 1234567890&#10;A nombre de: …">'+escapar(n.banco||"")+'</textarea></label>' +
      '<p class="ayuda" style="margin:-6px 0 13px">Esto le aparece al cliente solo si elige pagar por transferencia. Si lo dejás vacío, no se muestra nada.</p>' +
      '<label class="marca-check"><input type="checkbox" id="n-entrega"'+(n.pedirDireccion?" checked":"")+'> Pedir dirección de entrega en el pedido</label>' +
    '</div>' +
    '<div class="encabezado-lista"><h2>Horario</h2></div>' +
    '<div class="caja">' +
      h.dias.map((d,i) =>
        '<div class="fila-dia'+(d.abierto?'':' cerrado')+'" data-dia="'+i+'">' +
          '<label class="nombre-dia"><input type="checkbox" class="d-abierto" data-i="'+i+'"'+(d.abierto?" checked":"")+'> '+escapar(d.nombre)+'</label>' +
          '<input type="time" class="d-abre" data-i="'+i+'" value="'+d.abre+'"'+(d.abierto?'':' disabled')+'>' +
          '<input type="time" class="d-cierra" data-i="'+i+'" value="'+d.cierra+'"'+(d.abierto?'':' disabled')+'>' +
        '</div>'
      ).join("") +
      '<p class="ayuda" style="margin:10px 0 0;font-size:.85rem">El sitio muestra solo «abierto» o «cerrado» según esta tabla. Los pedidos se pueden mandar igual a toda hora.</p>' +
    '</div>' +
    bloqueApp();

  const enlazar = (sel, campo) => {
    const el = $(sel);
    el.addEventListener("input", () => {
      D.negocio[campo] = el.type === "checkbox" ? el.checked : el.value.trim();
      marcarSucio();
    });
  };
  enlazar("#n-nombre","nombre"); enlazar("#n-lema","lema"); enlazar("#n-wa","whatsapp");
  enlazar("#n-dir","direccion"); enlazar("#n-fb","facebook"); enlazar("#n-banco","banco");
  $("#n-entrega").addEventListener("change", e => { D.negocio.pedirDireccion = e.target.checked; marcarSucio(); });

  document.querySelectorAll(".d-abierto").forEach(el => el.addEventListener("change", e => {
    const i = +e.target.dataset.i;
    D.horario.dias[i].abierto = e.target.checked;
    marcarSucio(); pintarNegocio();
  }));
  document.querySelectorAll(".d-abre").forEach(el => el.addEventListener("input", e => {
    D.horario.dias[+e.target.dataset.i].abre = e.target.value; marcarSucio();
  }));
  document.querySelectorAll(".d-cierra").forEach(el => el.addEventListener("input", e => {
    D.horario.dias[+e.target.dataset.i].cierra = e.target.value; marcarSucio();
  }));
}

/* =========================================================
   Modal
   ========================================================= */
function abrirModal(html){
  $("#modal").innerHTML = '<div class="agarre"></div>' + html;
  $("#modal").classList.add("abierto");
  $("#velo").classList.add("abierto");
  document.body.style.overflow = "hidden";
}
function cerrarModal(){
  $("#modal").classList.remove("abierto");
  $("#velo").classList.remove("abierto");
  document.body.style.overflow = "";
}
$("#velo").addEventListener("click", cerrarModal);

/* =========================================================
   Clicks generales
   ========================================================= */
document.addEventListener("click", e => {
  if (e.target.closest("[data-cerrar]")) return cerrarModal();

  if (e.target.closest("#btn-instalar")) return instalarApp();

  if (e.target.closest("[data-recargar]")) return pintarPedidos();

  const filtro = e.target.closest("[data-filtro]");
  if (filtro){ filtroPedidos = filtro.dataset.filtro; return pintarPedidos(); }

  const cambio = e.target.closest("[data-estado]");
  if (cambio){
    const caja = cambio.closest(".pedido-caja");
    if (caja) caja.querySelectorAll("button").forEach(b => b.disabled = true);
    api("/pedidos/" + cambio.dataset.pedido, {
      method: "PATCH",
      body: JSON.stringify({ estado: cambio.dataset.estado })
    }).then(pintarPedidos).catch(err => {
      alert(err.message);
      if (caja) caja.querySelectorAll("button").forEach(b => b.disabled = false);
    });
    return;
  }

  if (e.target.closest("[data-nuevo-producto]")){
    if (!D.categorias.length) return alert("Primero creá una categoría.");
    return formularioProducto(null);
  }
  if (e.target.closest("[data-nueva-categoria]")) return formularioCategoria(null);

  const ed = e.target.closest("[data-editar]");
  if (ed) return formularioProducto(D.productos.find(p => p.id === ed.dataset.editar));

  const edc = e.target.closest("[data-editar-cat]");
  if (edc) return formularioCategoria(D.categorias.find(c => c.id === edc.dataset.editarCat));

  const pop = e.target.closest("[data-pop]");
  if (pop){ const p = D.productos.find(x => x.id === pop.dataset.pop); p.popular = !p.popular; marcarSucio(); return pintar(); }

  const ago = e.target.closest("[data-ago]");
  if (ago){ const p = D.productos.find(x => x.id === ago.dataset.ago); p.agotado = !p.agotado; marcarSucio(); return pintar(); }

  const sub = e.target.closest("[data-subir-cat]");
  if (sub){ const i = +sub.dataset.subirCat; if (i > 0){ const c = D.categorias.splice(i,1)[0]; D.categorias.splice(i-1,0,c); marcarSucio(); pintar(); } return; }

  const baj = e.target.closest("[data-bajar-cat]");
  if (baj){ const i = +baj.dataset.bajarCat; if (i < D.categorias.length-1){ const c = D.categorias.splice(i,1)[0]; D.categorias.splice(i+1,0,c); marcarSucio(); pintar(); } return; }
});

/* =========================================================
   Arranque: si ya entró antes, reconecta solo
   ========================================================= */
(async function(){
  /* Primero: ¿está el servidor listo? Si falta algo en Cloudflare
     conviene decirlo antes de que escriba una clave que no va a servir. */
  const est = await estadoServidor();
  if (est && est.falta && est.falta.length){
    mensaje("#msg-entrar",
      "Falta configurar en Cloudflare: " + est.falta.join(", ") +
      ". Mirá la Parte 6 de la guía.", "error");
    return;
  }

  const c = recordado("bati_clave");
  if (!c) return;
  mensaje("#msg-entrar","Conectando…","trabajando");
  try { await entrar(c); mensaje("#msg-entrar","",""); }
  catch(e){ mensaje("#msg-entrar", e.message + " Volvé a entrar.", "error"); olvidar("bati_clave"); }
})();
</script>
